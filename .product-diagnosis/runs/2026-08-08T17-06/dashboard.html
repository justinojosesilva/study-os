<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de produto</title>
<style>
:root{
  --paper:#F1F3F1; --card:#FFF; --ink:#14171A; --muted:#63696B; --rule:#DCE0DD;
  --accent:#1F4B57; --accent-soft:#E4EDEF; --warn:#9C4A22; --warn-soft:#F6E9E2;
  --dim:#8A918C; --ok:#2F6B4F;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#131614;--card:#1B1F1D;--ink:#E7EAE7;--muted:#9AA29D;--rule:#2C3230;
        --accent:#7FB8C4;--accent-soft:#1E2C30;--warn:#D98A63;--warn-soft:#2E211A;--dim:#767D78;--ok:#7BB394;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 96px}
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.10em;color:var(--muted);margin-bottom:14px}
.mono{font-family:var(--mono)}
header{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:32px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-family:var(--mono);
      font-size:12px;color:var(--muted)}
.env{padding:1px 7px;border:1px solid var(--rule);border-radius:3px}
.env.production{color:var(--warn);border-color:var(--warn)}
section{margin-bottom:44px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px}

/* health */
.health{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:start}
@media(max-width:640px){.health{grid-template-columns:1fr}}
.score{font-family:var(--mono);font-size:56px;line-height:1;letter-spacing:-.03em}
.score.unknown{font-size:26px;color:var(--muted)}
.score small{display:block;font-size:11px;letter-spacing:.10em;text-transform:uppercase;
             color:var(--muted);margin-top:10px;font-family:var(--sans)}
.conf{margin-top:12px;font-size:13px;color:var(--muted);max-width:210px}
.dims{display:flex;flex-direction:column;gap:9px}
.dim{display:grid;grid-template-columns:120px 1fr 42px;gap:12px;align-items:center;font-size:13px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.dim.unmeasured{color:var(--dim)}
.dim.unmeasured .bar{background:repeating-linear-gradient(90deg,var(--rule) 0 4px,transparent 4px 8px)}
.dim .val{font-family:var(--mono);text-align:right;font-size:12px}

/* priorities */
.opp{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;
     margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;
     gap:16px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit}
.opp:hover{border-color:var(--accent)}
.opp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rank{font-family:var(--mono);font-size:13px;color:var(--muted)}
.opp h3{font-size:16px}
.opp .sub{font-size:13px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;
      background:var(--accent-soft);color:var(--accent)}
.chip.low{background:transparent;border:1px dashed var(--rule);color:var(--dim)}
.right{text-align:right}
.scoreN{font-family:var(--mono);font-size:22px}
.track{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:2px}

/* map */
.map{display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:center}
@media(max-width:640px){.map{grid-template-columns:1fr}}
.legend{font-size:12px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* wont build */
.wont li{margin-bottom:12px;list-style:none}
.wont .why{font-size:13px;color:var(--muted)}
ul{padding:0;margin:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
       transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--card);
        border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .22s ease;
        overflow-y:auto;padding:28px 26px 60px}
.drawer.open{transform:none}
@media(prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer .close{position:absolute;top:18px;right:20px;background:none;border:0;color:var(--muted);
               font-size:22px;cursor:pointer;line-height:1}
.ev{border-top:1px solid var(--rule);padding:14px 0}
.ev .head{display:flex;gap:10px;align-items:baseline}
.ev .num{font-family:var(--mono);font-size:20px}
.ev .st{font-size:14px}
.ev .src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
.ev pre{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--rule);
        border-radius:6px;padding:9px 10px;overflow-x:auto;margin:8px 0 0;white-space:pre-wrap}
.gate{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;
      font-size:13px;margin-top:18px}
.gate b{font-family:var(--mono);font-weight:400}
.empty{color:var(--muted);font-size:14px}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('diagnosis').textContent);
const EV = Object.fromEntries(D.evidence.map(e => [e.id, e]));
const FND = Object.fromEntries(D.findings.map(f => [f.id, f]));
const TRACK_COLOR = {construir:'var(--warn)', validar:'var(--accent)', instrumentar:'var(--ok)',
                     investigar:'var(--muted)', 'nao-construir':'var(--dim)'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => Math.round(v * 100);

const active = D.opportunities.filter(o => o.track !== 'nao-construir').sort((a,b) => b.score - a.score);
const wont = D.opportunities.filter(o => o.track === 'nao-construir');

const h = D.health;
const healthBlock = `
<section><h2>Saúde do produto</h2><div class="card health">
  <div>
    ${h.score === null
      ? `<div class="score unknown">desconhecido<small>health score</small></div>`
      : `<div class="score">${h.score}<small>health score</small></div>`}
    <p class="conf">Confiança ${esc(h.confidence)}. ${esc(h.confidenceReason || '')}</p>
  </div>
  <div class="dims">${h.dimensions.map(d => `
    <div class="dim ${d.measured ? '' : 'unmeasured'}">
      <span>${esc(d.name)}</span>
      <span class="bar"><i style="width:${d.measured ? d.score : 0}%"></i></span>
      <span class="val">${d.measured ? d.score : '—'}</span>
    </div>`).join('')}
  </div>
</div></section>`;

const oppRow = (o, i) => `
<button class="opp" onclick="openDrawer('${o.id}')">
  <span class="rank mono">#${i + 1}</span>
  <span>
    <h3>${esc(o.title)}</h3>
    ${o.userOutcome ? `<div class="sub">${esc(o.userOutcome)}</div>` : ''}
    <span class="chips">${o.evidenceRefs.map(r =>
      `<span class="chip ${EV[r] && EV[r].confidence === 'low' ? 'low' : ''}">${r}</span>`).join('')}</span>
  </span>
  <span class="right"><span class="scoreN">${o.score}</span><div class="track">${esc(o.track)}</div></span>
</button>`;

const W = 460, H = 300, PAD = 40;
const px = v => PAD + (v - 1) / 4 * (W - PAD - 20);
const py = v => H - PAD - (v - 1) / 4 * (H - PAD - 20);
const mapBlock = `
<section><h2>Impacto × evidência</h2><div class="card map">
<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Oportunidades por impacto e evidência">
  <line x1="${PAD}" y1="${H-PAD}" x2="${W-10}" y2="${H-PAD}" stroke="var(--rule)"/>
  <line x1="${PAD}" y1="10" x2="${PAD}" y2="${H-PAD}" stroke="var(--rule)"/>
  <line x1="${px(3)}" y1="10" x2="${px(3)}" y2="${H-PAD}" stroke="var(--rule)" stroke-dasharray="3 4"/>
  <line x1="${PAD}" y1="${py(3)}" x2="${W-10}" y2="${py(3)}" stroke="var(--rule)" stroke-dasharray="3 4"/>
  <text x="${W-10}" y="${H-18}" text-anchor="end" font-size="11" fill="var(--muted)">evidência →</text>
  <text x="${PAD}" y="${H-16}" font-size="11" fill="var(--muted)">1</text>
  <text x="14" y="18" font-size="11" fill="var(--muted)">impacto</text>
  ${active.map(o => `<g style="cursor:pointer" onclick="openDrawer('${o.id}')">
      <circle cx="${px(o.dimensions.evidence)}" cy="${py(o.dimensions.impact)}"
              r="${5 + o.dimensions.reach * 1.6}" fill="${TRACK_COLOR[o.track]}" fill-opacity=".22"
              stroke="${TRACK_COLOR[o.track]}"/>
      <text x="${px(o.dimensions.evidence)}" y="${py(o.dimensions.impact) - 12 - o.dimensions.reach}"
            text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--muted)">${o.id}</text>
    </g>`).join('')}
</svg>
<div class="legend">
  ${[...new Set(active.map(o => o.track))].map(t =>
    `<div><span class="dot" style="background:${TRACK_COLOR[t]}"></span>${esc(t)}</div>`).join('')}
  <div style="margin-top:12px">Tamanho do círculo = alcance.</div>
  <div>Alto impacto e alta evidência: faça. Alto impacto e baixa evidência: investigue.</div>
</div>
</div></section>`;

document.getElementById('app').innerHTML = `
<header>
  <h1>${esc(D.meta.project)}</h1>
  <div class="meta">
    <span>${esc(D.meta.period.from)} → ${esc(D.meta.period.to)}</span>
    <span class="env ${esc(D.meta.environment)}">${esc(D.meta.environment)}</span>
    <span>${D.evidence.length} evidências · ${D.findings.length} achados · ${D.opportunities.length} oportunidades</span>
    <span>instrumentação ${pct(D.coverage.instrumentedRatio)}%</span>
  </div>
</header>
${healthBlock}
<section><h2>Prioridades</h2>
  ${active.length ? active.map(oppRow).join('') : '<p class="empty">Nenhuma oportunidade ativa nesta execução.</p>'}
</section>
${active.length ? mapBlock : ''}
<section><h2>Não construir</h2><div class="card"><ul class="wont">
  ${wont.length ? wont.map(o => `<li>
      <strong>${esc(o.title)}</strong>
      <div class="why">${esc(o.trackReason || '')}</div>
      <span class="chips">${o.evidenceRefs.map(r => `<span class="chip">${r}</span>`).join('')}</span>
    </li>`).join('')
   : '<li class="empty">Vazio — e isso é um defeito da execução, não um resultado. Toda análise precisa filtrar algo.</li>'}
</ul></div></section>`;

function evBlock(id) {
  const e = EV[id];
  if (!e) return '';
  const val = e.value === null ? '—'
    : e.unit === 'ratio' ? pct(e.value) + '%' : e.value.toLocaleString('pt-BR');
  return `<div class="ev">
    <div class="head"><span class="num">${val}</span><span class="st">${esc(e.statement)}</span></div>
    <div class="src">${id} · ${esc(e.kind)} · ${esc(e.source.type)}${e.source.ref ? ' · ' + esc(e.source.ref) : ''}
      · confiança ${esc(e.confidence)}${e.sampleSize != null ? ' · n=' + e.sampleSize : ''}</div>
    ${e.source.query ? `<pre>${esc(e.source.query)}</pre>` : ''}
  </div>`;
}

function openDrawer(oppId) {
  const o = D.opportunities.find(x => x.id === oppId);
  const g = o.gate;
  document.getElementById('drawerBody').innerHTML = `
    <div class="src mono" style="font-size:11px;color:var(--muted)">${o.id} · ${esc(o.track)} · score ${o.score}</div>
    <h1 style="margin:6px 0 8px">${esc(o.title)}</h1>
    ${o.userOutcome ? `<p style="margin:0 0 18px;color:var(--muted)">${esc(o.userOutcome)}</p>` : ''}
    ${o.findingRefs.map(f => FND[f] ? `<p style="font-size:14px"><strong>${esc(FND[f].title)}</strong><br>
        ${esc(FND[f].statement)}${FND[f].deadReason ? ` <span class="chip">${esc(FND[f].deadReason)}</span>` : ''}</p>` : '').join('')}
    <h2 style="margin-top:22px">Evidências</h2>
    ${o.evidenceRefs.map(evBlock).join('')}
    ${o.rationale ? `<h2 style="margin-top:22px">Julgamento</h2>
      <p style="font-size:13px;color:var(--muted)">
        ${['impact','reach','cost'].filter(k => o.rationale[k])
          .map(k => `<strong>${k} ${o.dimensions[k]}</strong> — ${esc(o.rationale[k])}`).join('<br>')}
      </p>` : ''}
    ${g ? `<div class="gate">Portão · <b>${esc(g.metric)}</b><br>
      baseline <b>${g.baseline === null ? '—' : g.baseline}</b> → alvo <b>${g.target}</b>
      · decidir até <b>${esc(g.decideBy)}</b></div>` : ''}`;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.querySelector('.drawer .close').focus();
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
</script>
